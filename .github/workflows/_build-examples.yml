name: Build Examples

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-examples:
    name: Build Example Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Builds every app under examples/compose and examples/views
      - name: Build examples
        run: ./gradlew -p examples assembleDebug

      - name: Upload example APKs
        uses: actions/upload-artifact@v7
        with:
          name: example-apks
          path: examples/**/build/outputs/apk/debug/*.apk
          retention-days: 30
