name: Build Library

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-library:
    name: Build OpenMapView AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build OpenMapView libraries
        run: ./gradlew :openmapview:assembleRelease :openmapview-compose:assembleRelease

      - name: Upload library artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmapview-aar
          path: openmapview*/build/outputs/aar/*.aar
          retention-days: 30
