name: Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build documentation
        run: ./gradlew dokkaGenerate --no-daemon

      - name: Generate License Report
        run: ./gradlew generateLicenseReport --no-daemon

      - name: Copy License Report to Docs
        run: |
          mkdir -p openmapview/build/dokka/html/licenses
          cp openmapview/build/reports/licenses/licenses.html openmapview/build/dokka/html/licenses/index.html

      - name: Run Android Lint
        run: ./gradlew :openmapview:lintRelease --no-daemon

      - name: Copy Lint Report to Docs
        run: |
          mkdir -p openmapview/build/dokka/html/lint
          cp openmapview/build/reports/lint-results-release.html openmapview/build/dokka/html/lint/index.html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: 'openmapview/build/dokka/html/**'
          retention-days: 30
