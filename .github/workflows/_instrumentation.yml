name: Instrumentation Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  instrumented-test:
    name: Run Instrumentation Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - device: phone
            profile: Nexus 6
          - device: automotive
            profile: automotive_1024p_landscape

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on ${{ matrix.device }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          script: ./gradlew :openmapview:connectedDebugAndroidTest --continue

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-test-results-${{ matrix.device }}
          path: '**/build/outputs/androidTest-results/connected/**/*.xml'
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-test-reports-${{ matrix.device }}
          path: '**/build/reports/androidTests/connected/**'
          retention-days: 30
