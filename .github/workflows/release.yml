name: Release to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # Needed to create GitHub releases

jobs:
  format:
    name: Check Formatting
    uses: ./.github/workflows/_format.yml

  lint:
    name: Static Analysis
    uses: ./.github/workflows/_lint.yml

  test:
    name: Unit Tests
    needs: [format, lint]
    uses: ./.github/workflows/_test.yml

  build-library:
    name: Build Library
    needs: [format, lint, test]
    uses: ./.github/workflows/_build-library.yml

  build-examples:
    name: Build Examples
    needs: [format, lint, test]
    uses: ./.github/workflows/_build-examples.yml

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # The Maven Central and signing secrets live in this environment, which only accepts release tags
    environment: release
    needs: [format, lint, test, build-library, build-examples]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate tag format
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Use vMAJOR.MINOR.PATCH (e.g., v1.2.3)"
            exit 1
          fi
          VERSION=$(echo $TAG | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Publish to Maven Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ env.TAG }}^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            CHANGELOG="Initial release of OpenMapView"
          else
            echo "Generating changelog from $PREV_TAG to ${{ env.TAG }}"
            CHANGELOG=$(git log ${PREV_TAG}..${{ env.TAG }} --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.VERSION }}
          body: |
            # OpenMapView ${{ env.VERSION }}

            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Installation
            Add to your `settings.gradle.kts`:
            ```gradle
            dependencyResolutionManagement {
                repositories {
                    mavenCentral()
                }
            }
            ```

            Add to your `build.gradle.kts`:
            ```kotlin
            dependencies {
                implementation("de.afarber:openmapview:${{ env.VERSION }}")
            }
            ```
          draft: false
          prerelease: false

